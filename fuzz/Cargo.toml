[package]
name = "luminess-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.luminess]
path = ".."

# The release `same_output` compares against, byte for byte.
[dependencies.luminess_base]
package = "luminess"
version = "=0.9.3"

# Keeps this crate out of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "compile"
path = "fuzz_targets/compile.rs"
test = false
doc = false

[[bin]]
name = "escape"
path = "fuzz_targets/escape.rs"
test = false
doc = false

[[bin]]
name = "same_output"
path = "fuzz_targets/same_output.rs"
test = false
doc = false
