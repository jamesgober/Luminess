[package]
name = "luminess-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.luminess]
path = ".."

# Keeps this crate out of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "compile"
path = "fuzz_targets/compile.rs"
test = false
doc = false

[[bin]]
name = "escape"
path = "fuzz_targets/escape.rs"
test = false
doc = false
