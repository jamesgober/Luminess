[package] 
name = "luminess"
version = "0.1.0"
edition = "2021"
readme  = "README.md"
license = "Apache-2.0"

documentation = "https://docs.rs/luminess"
repository    = "https://github.com/jamesgober/Luminess"
homepage      = "https://github.com/jamesgober/Luminess"

description = "A blazing fast template engine with configurable extensions, smart includes, and professional-grade directives"
keywords = [
    "template", 
    "engine", 
    "rendering", 
    "html",
    "web",
]
categories = [
    "template-engine",
    "web-programming", 
    "rendering",
    "development-tools"
]
exclude = [
    ".github/",
    "benches/",
    "docs/",
    "dev/",
]

authors = [
    "James Gober <code@jamesgober.dev>"
]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
