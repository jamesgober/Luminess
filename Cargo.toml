# =============================================================================
#  L U M I N E S S
# =============================================================================
[package]
name    = "luminess"
version = "0.7.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

license = "Apache-2.0"
readme = "README.md"

description = "Template engine that compiles at startup against typed views: unknown fields fail at compile time, output is escaped for its HTML context, and rendering writes straight into your buffer. Zero dependencies."

keywords = ["template", "html", "templating", "render", "web"]
categories = ["template-engine", "web-programming"]

homepage      = "https://github.com/jamesgober/Luminess"
repository    = "https://github.com/jamesgober/Luminess"
documentation = "https://docs.rs/luminess"

authors = ["James Gober <me@jamesgober.com>"]

include = [
    "src/**/*.rs",
    "examples/*.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "luminess"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# None. Luminess has zero runtime dependencies.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# Property tests only; never a runtime dependency.
proptest = { version = "1", default-features = false, features = ["std"] }


[[bench]]
name = "render"
harness = false
